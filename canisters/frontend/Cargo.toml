[package]
name = "b2z-embedded-frontend"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
candid = "=0.10.28"
ic-cdk = "=0.20.1"
ic-asset-certification = "=3.2.0"
ic-http-certification = "=3.2.0"
include_dir = "=0.7.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
