# Disposable, controller-only integration laboratory. Not a deployable game release.
[workspace]
[package]
name = "dtr-runtime-lab"
version = "0.5.0"
edition = "2021"
publish = false
[features]
test-hooks = []
canbench = ["dep:canbench-rs"]
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
ic-cdk = "=0.20.3"
ic-cdk-timers = "=1.0.0"
ic-ledger-types = "=0.16.0"
candid = "=0.10.28"
ic-stable-structures = "=0.7.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
dtr-host = { git = "https://github.com/aodl/dtr.git", rev = "71e59e93cf49a3656689679b538b4c3f138787f8" }
dtr-wire = { git = "https://github.com/aodl/dtr.git", rev = "71e59e93cf49a3656689679b538b4c3f138787f8" }
btz-native = { path = "../../native/btz-native" }
canbench-rs = { version = "=0.7.0", optional = true }
[dev-dependencies]
candid_parser = "=0.4.1"
[profile.release]
overflow-checks = true
lto = true
codegen-units = 1
