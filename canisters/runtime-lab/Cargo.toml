# Disposable, controller-only integration laboratory. Not a deployable game release.
[workspace]
[package]
name = "dtr-runtime-lab"
version = "0.5.0"
edition = "2021"
publish = false
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
ic-cdk = "=0.20.3"
candid = "=0.10.28"
ic-stable-structures = "=0.7.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
dtr-host = { path = "../../native/dtr-host" }
dtr-wire = { path = "../../native/dtr-wire" }
btz-native = { path = "../../native/btz-native" }
[profile.release]
overflow-checks = true
lto = true
codegen-units = 1
