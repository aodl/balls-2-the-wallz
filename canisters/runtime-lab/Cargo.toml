# B2Z authoritative host; historical crate name retained to keep build paths stable.
[workspace]
[package]
name = "dtr-runtime-lab"
version = "0.5.0"
edition = "2021"
publish = false
[features]
test-hooks = []
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
b2z-protocol = { path = "../../crates/b2z-protocol" }
ic-cdk = "=0.20.3"
ic-cdk-timers = "=1.0.0"
ic-ledger-types = "=0.16.0"
candid = "=0.10.28"
ic-stable-structures = "=0.7.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
dtr-host = { git = "https://github.com/aodl/dtr.git", rev = "77ba46cb2f0acd0b4b2eaeedf7dc9fd2dc0f6c68" }
dtr-wire = { git = "https://github.com/aodl/dtr.git", rev = "77ba46cb2f0acd0b4b2eaeedf7dc9fd2dc0f6c68" }
b2z-native = { path = "../../native/b2z-native" }
[dev-dependencies]
candid_parser = "=0.4.1"
[profile.release]
overflow-checks = true
lto = true
codegen-units = 1
