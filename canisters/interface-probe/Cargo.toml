# Deliberately isolated so IC dependencies cannot prevent offline pure-kernel checks.
[workspace]
[package]
name = "dtr-interface-probe"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ic-cdk = "=0.20.1"
candid = "=0.10.29"
serde = { version = "=1.0.228", features = ["derive"] }

[profile.release]
overflow-checks = true
lto = true
codegen-units = 1
