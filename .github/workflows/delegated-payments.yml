name: Rules18 delegated-payment qualification

# Additional financial qualification alongside the standard verification.
on:
  push:
    branches: [master, feature/b2z-rules18-delegated-payments, feature/b2z-temporary-dev-speed, feature/b2z-rules19-compact-reservoirs]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact published feature source (full 40-character commit)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: delegated-payments-${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  disposable-financial-path:
    name: Optional ICRC-2 / exact predecessor / replay
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: 1.94.1
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      DFX_IDENTITY: codex_local
      EXPECTED_SOURCE: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Require an exact source identity
        run: python3 -c 'import os,re; assert re.fullmatch("[0-9a-f]{40}",os.environ["EXPECTED_SOURCE"])'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify checkout
        run: python -c 'import os,subprocess; assert subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()==os.environ["EXPECTED_SOURCE"]'
      - run: npm ci --ignore-scripts
      - run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Fetch locked dependencies
        run: |
          for manifest in canisters/runtime-lab/Cargo.toml tools/s09-integration/Cargo.toml tools/s14-index-fixture/Cargo.toml tools/cmc-funding-fixture/Cargo.toml; do
            cargo fetch --manifest-path "$manifest" --locked
          done
      - run: python -B tools/fetch_s09_artifacts.py --destination /home/runner/dtr-s09-artifacts --record .work/ci-delegated-artifacts.json
      - name: Verify frozen backend and materialize exact disposable predecessors
        run: |
          if git merge-base --is-ancestor c4bbc077a0be393d1c99f49f064e795dfaceafd3 HEAD 2>/dev/null; then
            python -B tools/verify_rules18_mainline.py --backend-only --output .work/ci-rules18-inputs
          else
            python -B tools/verify_approved_panel_freeze.py --backend-only --artifacts evidence/B2Z/rules18-delegated-payments/artifacts --output .work/ci-rules18-inputs
          fi
          for artifact in rules15-8d7f1a67 rules16-a5889a92 rules17-c066140f; do
            gzip -dc "vendor/b2z/$artifact.wasm.gz" > ".work/$artifact.wasm"
          done
      - name: Exact-source signed financial qualification
        env:
          B2Z_QUALIFY_COMPACT_RESERVOIR: '1'
        run: >-
          python -B tools/verify_s14_local.py
          --test-filter context_structures_installed::delegation_rules17_upgrade_signed_ledger_and_replay
          --rules15-prior-wasm .work/rules15-8d7f1a67.wasm
          --rules16-prior-wasm .work/rules16-a5889a92.wasm
          --rules17-prior-wasm .work/rules17-c066140f.wasm
          --output .work/ci-delegated
      - name: Archive the financial gate normal module identity
        run: sha256sum .work/ci-delegated/normal.wasm > .work/ci-delegated/normal.sha256
      - name: Preserve financial evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: delegated-payment-evidence
          path: |
            .work/ci-delegated-artifacts.json
            .work/ci-delegated/results.json
            .work/ci-delegated/generated.did
            .work/ci-delegated/normal.wasm
            .work/ci-delegated/normal.sha256
            .work/ci-delegated/logs/**
            .work/ci-delegated/deployment/**
          if-no-files-found: warn
          retention-days: 14


  browser-flow:
    name: Optional ICRC-2 browser and native Web Locks
    # Same sandbox-capable image as the standard verification browser job.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Verify exact checkout
        run: python -c 'import os,re,subprocess; assert re.fullmatch("[0-9a-f]{40}",os.environ["EXPECTED_SOURCE"]) and subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()==os.environ["EXPECTED_SOURCE"]'
      - run: npm ci --ignore-scripts
      - run: python -m pip install --require-hashes -r tools/browser-requirements.txt
      - run: python -m playwright install chromium
      - name: Optional UI, immutable-intent and native two-tab journeys
        run: python -B tools/verify_delegated_payment_ui.py --output .work/ci-delegated-ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: delegated-payment-browser-evidence
          path: .work/ci-delegated-ui/**
          if-no-files-found: warn
          retention-days: 14
