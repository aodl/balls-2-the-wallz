name: experimental delegated-payment qualification

# Additional financial qualification, never a substitute for the six ordinary
# substantive jobs. Explicit dispatch prevents an unfinished feature becoming
# part of the independent frontend release or activating production payments.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact published feature source (full 40-character commit)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: delegated-payments-${{ inputs.source_sha }}
  cancel-in-progress: false
jobs:
  disposable-financial-path:
    name: Optional ICRC-2 / exact predecessor / replay / UI
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: 1.94.1
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      DFX_IDENTITY: codex_local
      EXPECTED_SOURCE: ${{ inputs.source_sha }}
    steps:
      - name: Require an exact source identity
        run: python3 -c 'import os,re; assert re.fullmatch("[0-9a-f]{40}",os.environ["EXPECTED_SOURCE"])'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify checkout
        run: python -c 'import os,subprocess; assert subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()==os.environ["EXPECTED_SOURCE"]'
      - run: npm ci --ignore-scripts
      - run: python -m pip install --require-hashes -r tools/browser-requirements.txt
      - run: python -m playwright install chromium
      - run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Fetch locked dependencies
        run: |
          for manifest in canisters/runtime-lab/Cargo.toml tools/s09-integration/Cargo.toml tools/s14-index-fixture/Cargo.toml tools/cmc-funding-fixture/Cargo.toml; do
            cargo fetch --manifest-path "$manifest" --locked
          done
      - run: python -B tools/fetch_s09_artifacts.py --destination /home/runner/dtr-s09-artifacts --record .work/ci-delegated-artifacts.json
      - name: Materialize exact European predecessor (local test only)
        run: |
          python - <<'PY'
          import gzip,hashlib
          from pathlib import Path
          data=gzip.decompress(Path('vendor/b2z/europe-612ad0d0.wasm.gz').read_bytes())
          assert hashlib.sha256(data).hexdigest()=='612ad0d089c637f32cd1a050cbb9dc01ae6245145b9640086c009dbde8a8e948'
          Path('.work').mkdir(exist_ok=True)
          Path('.work/delegation-predecessor.wasm').write_bytes(data)
          PY
      - name: Exact-source disposable financial qualification
        run: >-
          python -B tools/verify_s14_local.py --delegated-payments
          --test-filter delegated_payments::
          --delegation-prior-wasm .work/delegation-predecessor.wasm
          --delegation-prior-sha256 612ad0d089c637f32cd1a050cbb9dc01ae6245145b9640086c009dbde8a8e948
          --output .work/ci-delegated
      - name: Optional UI, immutable-intent and native two-tab journeys
        run: python -B tools/verify_delegated_payment_ui.py --output .work/ci-delegated-ui
      - name: Preserve financial evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: delegated-payment-evidence
          path: |
            .work/ci-delegated-artifacts.json
            .work/ci-delegated/results.json
            .work/ci-delegated/generated.did
            .work/ci-delegated/*.wasm
            .work/ci-delegated/logs/**
            .work/ci-delegated/deployment/**
            .work/ci-delegated-ui/**
          if-no-files-found: warn
          retention-days: 14
