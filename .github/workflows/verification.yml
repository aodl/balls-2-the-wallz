name: verification

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  source:
    name: Source conformance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python -B tools/check.py source --output .work/ci-source

  native:
    name: Native conformance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - run: cargo +1.94.1 fetch --manifest-path Cargo.toml --locked
      - run: cargo +1.94.1 fetch --manifest-path native/Cargo.toml --locked
      - run: cargo +1.94.1 fmt --all -- --check
      - run: cargo +1.94.1 clippy --workspace --all-targets --locked --offline -- -D warnings
      - run: cargo +1.94.1 test --workspace --locked --offline
      - run: python -B tools/verify_native.py
      - run: cargo +1.94.1 fmt --manifest-path native/Cargo.toml --all -- --check
      - run: cargo +1.94.1 clippy --manifest-path native/Cargo.toml --workspace --all-targets --locked --offline -- -D warnings
      - run: cargo +1.94.1 test --manifest-path native/Cargo.toml --workspace --locked --offline
      - run: python -B tools/verify_portable_native.py
      - run: python -B tools/verify_host_native.py

  wasm:
    name: Runtime-lab Wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - run: cargo +1.94.1 fetch --manifest-path canisters/runtime-lab/Cargo.toml --locked
      - run: cargo +1.94.1 fmt --manifest-path canisters/runtime-lab/Cargo.toml --all -- --check
      - run: cargo +1.94.1 clippy --manifest-path canisters/runtime-lab/Cargo.toml --target wasm32-unknown-unknown --all-targets --locked --offline -- -D warnings
      - run: cargo +1.94.1 build --manifest-path canisters/runtime-lab/Cargo.toml --release --target wasm32-unknown-unknown --locked --offline

  browser:
    name: Browser HTTP and Web Crypto
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install --require-hashes -r tools/browser-requirements.txt
      - run: python -m playwright install chromium
      - run: python -B tools/verify_observer_http.py --output .work/ci-browser

  blocked-integration-inventory:
    name: BLOCKED integration inventory (not a pass)
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo '::warning::BLOCKED: PocketIC upgrade/trap/ledger integration, generated Candid comparison, real certificate verification, financial gates, dependency audit, reproducible Wasm, and measured cost/capacity remain unexecuted.'
          echo 'This inventory is informational and does not convert missing evidence into a passing test.'
