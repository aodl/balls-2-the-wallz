name: verification

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  source:
    name: Source conformance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python -B tools/check.py source --output .work/ci-source
      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-evidence
          path: |
            .work/ci-source/environment.json
            .work/ci-source/verification.json
            .work/ci-source/logs/**
          if-no-files-found: warn
          retention-days: 14

  native:
    name: Native conformance
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.94.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - run: cargo +1.94.1 fetch --manifest-path Cargo.toml --locked
      - run: cargo +1.94.1 fetch --manifest-path native/Cargo.toml --locked
      - run: python -B tools/check.py native --output .work/ci-native
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-evidence
          path: |
            .work/ci-native/environment.json
            .work/ci-native/verification.json
            .work/ci-native/logs/**
          if-no-files-found: warn
          retention-days: 14

  package-consumers:
    name: Packaged DTR and clean consumers
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.94.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: rustup toolchain install 1.94.1 --profile minimal
      - run: python -B tools/verify_dtr_consumers.py --output .work/ci-package-consumers
      - name: Upload package-consumer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-consumer-evidence
          path: |
            .work/ci-package-consumers/results.json
            .work/ci-package-consumers/logs/**
          if-no-files-found: warn
          retention-days: 14

  wasm:
    name: Runtime-lab Wasm
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.94.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - run: cargo +1.94.1 fetch --manifest-path canisters/runtime-lab/Cargo.toml --locked
      - run: python3 -B tools/check.py wasm --output .work/ci-wasm
      - name: Upload Wasm evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasm-evidence
          path: |
            .work/ci-wasm/environment.json
            .work/ci-wasm/verification.json
            .work/ci-wasm/logs/**
          if-no-files-found: warn
          retention-days: 14

  browser:
    name: Browser HTTP and Web Crypto
    # Ubuntu 24.04 restricts Chromium's unprivileged user-namespace sandbox.
    # Keep Playwright's sandbox enabled on the supported hosted-runner image.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python -m pip install --require-hashes -r tools/browser-requirements.txt
      - run: python -m playwright install chromium
      - run: python -B tools/check.py browser --output .work/ci-browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-evidence
          path: |
            .work/ci-browser/environment.json
            .work/ci-browser/verification.json
            .work/ci-browser/logs/**
            .work/ci-browser/browser-http/results.json
            .work/ci-browser/browser-http/*.png
          if-no-files-found: warn
          retention-days: 14

  local-ic-integration:
    name: S14 and million-cell installed-IC qualification
    # The browser and PocketIC remain live concurrently with Chromium's sandbox enabled.
    runs-on: ubuntu-22.04
    env:
      RUSTUP_TOOLCHAIN: 1.94.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: python -m pip install --require-hashes -r tools/browser-requirements.txt
      - run: python -m playwright install chromium
      - run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - run: cargo +1.94.1 fetch --manifest-path canisters/runtime-lab/Cargo.toml --locked
      - run: cargo +1.94.1 fetch --manifest-path tools/s09-integration/Cargo.toml --locked
      - run: cargo +1.94.1 fetch --manifest-path tools/s14-index-fixture/Cargo.toml --locked
      - run: python -B tools/fetch_s09_artifacts.py --destination /home/runner/dtr-s09-artifacts --record .work/ci-s14-artifacts.json
      - run: python -B tools/check.py integration --output .work/ci-integration
      - name: Upload local IC evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: local-ic-evidence
          path: |
            .work/ci-integration/environment.json
            .work/ci-integration/verification.json
            .work/ci-integration/logs/**
            .work/ci-integration/s14-local/*.json
            .work/ci-integration/s14-local/generated.did
            .work/ci-integration/s14-local/logs/**
            .work/ci-integration/s14-local/deployment/browser.log
            .work/ci-integration/s14-local/deployment/results.json
            .work/ci-integration/s14-local/deployment/million-*.json
            .work/ci-integration/s14-local/deployment/million-browser/**
            .work/ci-integration/s14-local/deployment/million-certified-checkpoint/**
            .work/ci-integration/s14-local/*.wasm
            .work/ci-integration/s14-local/snapshot/**
          if-no-files-found: warn
          retention-days: 14

  remaining-production-inventory:
    name: BLOCKED production inventory (not a pass)
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo '::warning::BLOCKED: user-operated mainnet deployment, financial/settlement gates and measured target-subnet capacity remain unexecuted.'
          echo 'This inventory is informational and does not convert missing evidence into a passing test.'
