name: Rules16 frontend-only qualification

on:
  push:
    branches: [feature/b2z-rules16-toolbar-payments]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rules16-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-browser:
    name: Source, exact memos and browser
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - run: python -B tools/check.py source --output .work/ci-frontend-source
      - run: python -m pip install --require-hashes -r tools/browser-requirements.txt
      - run: python -m playwright install chromium
      - run: python -B tools/verify_isometric_orbit.py --reservoir-only --output .work/ci-reservoir-toolbar
      - run: python -B tools/verify_isometric_orbit.py --interaction-polish --floating-aim --output .work/ci-toolbar-aim
      - run: python -B tools/verify_quantity_browser.py --output .work/ci-quantity
      - run: python -B tools/verify_playability_actions.py --output .work/ci-payment-actions
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rules16-frontend-browser
          path: |
            .work/ci-toolbar-aim/*.png
            .work/ci-toolbar-aim/results.json
            .work/ci-quantity/results.json
            .work/ci-reservoir-toolbar/*.png
            .work/ci-reservoir-toolbar/results.json
            .work/ci-payment-actions/results.json
            .work/ci-frontend-source/verification.json

  embedded-frontend:
    name: Reproducible embedded frontend and HTTP certification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - run: rustup toolchain install 1.94.1 --profile minimal --target wasm32-unknown-unknown
      - run: cargo +1.94.1 fetch --manifest-path canisters/frontend/Cargo.toml --locked
      - name: Reproduce the immutable candidate twice
        run: |
          set -euo pipefail
          assets=evidence/B2Z/rules16-toolbar-payments/artifacts
          python -B tools/verify_approved_panel_freeze.py --artifacts "$assets" --output .work/ci-toolbar-freeze
          for build in a b; do
            python -B tools/build_embedded_frontend.py --observer .work/ci-toolbar-freeze/reproduced --inventory "$assets/frontend-inventory.json" --output ".work/ci-toolbar-$build"
          done
          cmp .work/ci-toolbar-a/frontend.wasm .work/ci-toolbar-b/frontend.wasm
          cmp "$assets/embedded-inventory.json" .work/ci-toolbar-a/embedded-inventory.json
          python -c 'import json,sys; a,b=[json.load(open(x)) for x in sys.argv[1:]]; assert a["sha256"]==b["sha256"],(a,b)' "$assets/embedded-module.json" .work/ci-toolbar-a/module.json
      - run: cargo +1.94.1 test --manifest-path .work/ci-toolbar-a/compile/Cargo.toml --locked --offline
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rules16-frontend-wasm
          path: |
            .work/ci-toolbar-a/frontend.wasm
            .work/ci-toolbar-a/module.json
            .work/ci-toolbar-a/embedded-inventory.json
            .work/ci-toolbar-freeze/result.json
