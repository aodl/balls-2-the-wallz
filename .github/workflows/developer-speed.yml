# TEMPORARY DEVELOPMENT ONLY — REMOVE BEFORE PUBLIC LAUNCH
name: Temporary developer speed qualification
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: developer-speed-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Reproducible frontend and owner browser control
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - run: python -m pip install --require-hashes -r tools/browser-requirements.txt
      - run: python -m playwright install chromium
      - run: rustup toolchain install 1.94.1 --profile minimal --target wasm32-unknown-unknown
      - run: cargo +1.94.1 fetch --manifest-path canisters/frontend/Cargo.toml --locked
      - run: python -B tools/check.py source --output .work/ci-dev-source
      - name: Run desktop and mobile developer control tests
        run: python -B tools/verify_dev_speed_browser.py --output .work/ci-dev-ui
      - name: Build exact embedded frontend twice and verify public-launch exclusion
        run: |
          for build in a b; do
            python -B tools/build_dev_speed_frontend.py --output ".work/ci-dev-$build"
          done
          cmp .work/ci-dev-{a,b}/release/frontend.wasm
          cmp .work/ci-dev-{a,b}/release/embedded-inventory.json
          if python -B tools/build_embedded_frontend.py --observer .work/ci-dev-a/verified-base/reproduced --inventory .work/ci-dev-a/inventory.json --output .work/ci-dev-public > .work/ci-dev-public-guard.log 2>&1; then
            exit 1
          fi
          grep -F 'public launch frontend excludes the temporary speed control' .work/ci-dev-public-guard.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: developer-speed-frontend
          path: |
            .work/ci-dev-a/release/frontend.wasm
            .work/ci-dev-a/release/module.json
            .work/ci-dev-a/release/embedded-inventory.json
            .work/ci-dev-ui/result.json
            .work/ci-dev-ui/ii-gateway.json
            .work/ci-dev-ui/*.png
            .work/ci-dev-public-guard.log
          if-no-files-found: error
          retention-days: 14
  installed:
    name: Exact Rules18 upgrade, speed, payments and independent replay
    # Use the same Chromium user-namespace sandbox support as standard browser qualification.
    runs-on: ubuntu-22.04
    needs: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: developer-speed-frontend
          path: .work/qualified-dev-frontend
      - run: npm ci --ignore-scripts
      - run: python -m pip install --require-hashes -r tools/browser-requirements.txt
      - run: python -m playwright install chromium
      - run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --target wasm32-unknown-unknown
      - name: Fetch exact locked dependencies and install fixtures
        run: |
          for manifest in canisters/runtime-lab/Cargo.toml tools/s09-integration/Cargo.toml tools/s14-index-fixture/Cargo.toml tools/cmc-funding-fixture/Cargo.toml; do
            cargo fetch --manifest-path "$manifest" --locked
          done
          python -B tools/fetch_s09_artifacts.py --destination /home/runner/dtr-s09-artifacts --record .work/ci-dev-fixtures.json
          for artifact in rules15-8d7f1a67 rules16-a5889a92 rules17-c066140f; do
            gzip -dc "vendor/b2z/$artifact.wasm.gz" > ".work/$artifact.wasm"
          done
          gzip -dc vendor/b2z/rules18-43095677.wasm.gz > .work/rules18-43095677.wasm
          gzip -dc vendor/b2z/rules18-dev-9fb444b0.wasm.gz > .work/rules18-dev-9fb444b0.wasm
      - name: Use portable backend source paths
        run: echo "CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS=--remap-path-prefix=$PWD=/src/b2z/backend --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo" >> "$GITHUB_ENV"
      - name: Build and freeze the production candidate and separate fault-test module
        run: |
          export CARGO_TARGET_DIR="$PWD/.work/dev-target"
          manifest=canisters/runtime-lab/Cargo.toml
          output="$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/dtr_runtime_lab.wasm"
          cargo fmt --manifest-path "$manifest" --all -- --check
          cargo fmt --manifest-path tools/s09-integration/Cargo.toml --all -- --check
          cargo build --manifest-path "$manifest" --release --target wasm32-unknown-unknown --locked --offline --features developer-speed
          cp "$output" .work/developer-speed-release.wasm
          sha256sum .work/developer-speed-release.wasm > .work/developer-speed-release.sha256
          python -B tools/check_prelaunch_wasm.py developer-speed .work/developer-speed-release.wasm > .work/developer-speed-interface.json
          cargo build --manifest-path "$manifest" --release --target wasm32-unknown-unknown --locked --offline --features developer-speed,test-hooks
          cp "$output" .work/developer-speed-test.wasm
          cargo test --manifest-path "$manifest" --locked --offline --features developer-speed pace::tests
          if cargo check --manifest-path "$manifest" --locked --offline --target wasm32-unknown-unknown --features developer-speed,public-launch > .work/dev-public-backend.log 2>&1; then
            exit 1
          fi
          grep -F 'error: The public-launch build cannot include the temporary developer-speed override' .work/dev-public-backend.log
      - name: Test authorization, expiry, restart, reserve and ordinary pacing
        run: >-
          python -B tools/verify_s14_local.py --dev-speed-wasm .work/developer-speed-test.wasm
          --test-filter dev_speed_installed::dev_speed_switches_authoritative_pace_and_preserves_replay
          --output .work/ci-dev-isolated
      - name: Rehearse the exact installed Rules18 upgrade with queued signed Ledger payments
        run: |
          mapfile -t frontend < <(find .work/qualified-dev-frontend -type f -name frontend.wasm)
          test "${#frontend[@]}" = 1
          python -B tools/verify_s14_local.py \
            --test-filter context_structures_installed::delegation_rules17_upgrade_signed_ledger_and_replay \
            --rules15-prior-wasm .work/rules15-8d7f1a67.wasm \
            --rules16-prior-wasm .work/rules16-a5889a92.wasm \
            --rules17-prior-wasm .work/rules17-c066140f.wasm \
            --rules18-prior-wasm .work/rules18-43095677.wasm \
            --dev-speed-prior-wasm .work/rules18-dev-9fb444b0.wasm \
            --dev-speed-release-wasm .work/developer-speed-release.wasm \
            --dev-speed-frontend "$(dirname "${frontend[0]}")" \
            --output .work/ci-dev-rules18
      - name: Exact high-cell cutover, independent replay and installed browser recovery
        run: |
          cargo build --manifest-path canisters/runtime-lab/Cargo.toml --release --target wasm32-unknown-unknown --locked --offline --features developer-speed,cost-profile
          cp canisters/runtime-lab/target/wasm32-unknown-unknown/release/dtr_runtime_lab.wasm .work/rules19-profile.wasm
          gzip -dc tests/fixtures/rules19-paid-world-17529-state.bin.gz > .work/rules19-paid-world.bin
          printf '%s  %s\n' 25c2bb87e0ebeabd2f93bd4295e3296fb2e7ffba26b6a2c5cd3dc420f1bf3f10 .work/rules19-paid-world.bin | sha256sum --check
          python -B tools/profile_rules18_cost.py --world .work/rules19-paid-world.bin \
            --profile-wasm .work/rules19-profile.wasm --compact-using .work/rules19-profile.wasm \
            --measure-wasm .work/developer-speed-release.wasm --predecessor-wasm .work/rules18-43095677.wasm --case two_ball --case payment \
            --output .work/ci-rules19-cost
          python -B tools/profile_rules18_cost.py --world .work/rules19-paid-world.bin \
            --profile-wasm .work/rules19-profile.wasm --compact-using .work/rules19-profile.wasm \
            --measure-wasm .work/developer-speed-release.wasm --case moderate --case large \
            --case idle --case protected --case retained --jobs 2 --output .work/ci-rules19-scale
          python -B tools/profile_rules18_cost.py --world .work/rules19-paid-world.bin \
            --profile-wasm .work/rules19-profile.wasm --compact-using .work/developer-speed-release.wasm \
            --measure-wasm .work/developer-speed-release.wasm --case two_ball \
            --browser-python "$(command -v python)" --output .work/ci-rules19-browser
      - name: Qualify the capped pre-launch artifacts against the exact installed Rules19
        run: |
          manifest=canisters/runtime-lab/Cargo.toml
          wasm=canisters/runtime-lab/target/wasm32-unknown-unknown/release/dtr_runtime_lab.wasm
          cargo build --manifest-path "$manifest" --release --target wasm32-unknown-unknown --locked --offline --features prelaunch-trickle
          cp "$wasm" .work/prelaunch-trickle.wasm
          python -B tools/check_prelaunch_wasm.py prelaunch-trickle .work/prelaunch-trickle.wasm > .work/prelaunch-trickle-interface.json
          cargo build --manifest-path "$manifest" --release --target wasm32-unknown-unknown --locked --offline --features prelaunch-trickle,test-hooks
          cp "$wasm" .work/prelaunch-trickle-probe.wasm
          cargo test --manifest-path "$manifest" --locked --offline --features prelaunch-trickle prelaunch_tests
          if cargo check --manifest-path "$manifest" --locked --offline --target wasm32-unknown-unknown --features prelaunch-trickle,public-launch > .work/prelaunch-public-guard.log 2>&1; then
            exit 1
          fi
          grep -F 'error: The public-launch build cannot include the temporary developer-speed override' .work/prelaunch-public-guard.log
          gzip -dc vendor/b2z/rules19-b258ec23.wasm.gz > .work/rules19-production.wasm
          python -B tools/check_rules19_module.py public_backend .work/rules19-production.wasm
          mapfile -t frontend < <(find .work/qualified-dev-frontend -type f -name frontend.wasm)
          test "${#frontend[@]}" = 1
          python -B tools/profile_rules18_cost.py --world .work/rules19-paid-world.bin \
            --profile-wasm .work/rules19-profile.wasm --compact-using .work/rules19-production.wasm \
            --measure-wasm .work/prelaunch-trickle.wasm --prelaunch-test-wasm .work/prelaunch-trickle-probe.wasm \
            --prelaunch-frontend "$(dirname "${frontend[0]}")" --case two_ball --browser-python "$(command -v python)" \
            --output .work/ci-prelaunch-trickle
      - name: Live certified burn browser and maintained agent on disposable PocketIC
        if: github.head_ref == 'codex/certified-burn-integration'
        run: |
          curl --fail --location --retry 3 --max-time 120 \
            https://github.com/aodl/balls-2-the-wallz/releases/download/production%2Feurope-rules19-prelaunch-trickle/europe-rules19-prelaunch-trickle.zip \
            --output .work/rules19-installed-release.zip
          unzip -p .work/rules19-installed-release.zip prelaunch-trickle.wasm > .work/rules19-installed.wasm
          printf '%s  %s\n' b19e4ba3a11339b71dc20134bcfac525f63530461f11a593d7d880eb86b5bc90 .work/rules19-installed.wasm | sha256sum --check
          export CARGO_TARGET_DIR="$PWD/.work/dev-target"
          cargo build --manifest-path canisters/runtime-lab/Cargo.toml --release --target wasm32-unknown-unknown --locked --offline --features prelaunch-trickle,certified-operational-burn
          cp "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/dtr_runtime_lab.wasm" .work/certified-burn-normal.wasm
          python -B tools/check_prelaunch_wasm.py prelaunch-trickle .work/certified-burn-normal.wasm > .work/certified-burn-normal-interface.json
          printf '%s  %s\n' 3bb76656d3c903e858c9b9e373d9baab311b930e0dcb78d19a5807ff5e78376d .work/certified-burn-normal.wasm | sha256sum --check
          sha256sum .work/certified-burn-normal.wasm > .work/certified-burn-normal.sha256
          python -B tools/run_certified_burn_live.py \
            --profile .work/rules19-profile.wasm --compact .work/prelaunch-trickle.wasm \
            --prior .work/rules19-installed.wasm --candidate .work/certified-burn-normal.wasm \
            --world .work/rules19-paid-world.bin --artifacts /home/runner/dtr-s09-artifacts \
            --browser-python "$(command -v python)" --output .work/ci-certified-burn-live
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: developer-speed-backend-and-replay
          path: |
            .work/developer-speed-release.wasm
            .work/developer-speed-release.sha256
            .work/dev-public-backend.log
            .work/developer-speed-interface.json
            .work/prelaunch-trickle.wasm
            .work/prelaunch-trickle-interface.json
            .work/prelaunch-public-guard.log
            .work/ci-prelaunch-trickle/**
            !.work/ci-prelaunch-trickle/two_ball/browser/assets/**
            !.work/ci-prelaunch-trickle/two_ball/browser/mainnet-assets/**
            .work/ci-dev-isolated/results.json
            .work/ci-dev-isolated/deployment/dev-speed.json
            .work/ci-dev-isolated/logs/**
            .work/ci-rules19-cost/**
            .work/ci-rules19-scale/**
            .work/ci-rules19-browser/**
            !.work/ci-rules19-browser/two_ball/browser/assets/**
            !.work/ci-rules19-browser/two_ball/browser/mainnet-assets/**
            .work/ci-dev-rules18/results.json
            .work/ci-dev-rules18/deployment/reservoir/developer-speed-rules18.json
            .work/ci-dev-rules18/deployment/reservoir/developer-speed-certified-frontend.json
            .work/ci-dev-rules18/deployment/reservoir/authenticated/result.json
            .work/ci-dev-rules18/logs/**
            .work/certified-burn-normal.wasm
            .work/certified-burn-normal.sha256
            .work/certified-burn-normal-interface.json
            .work/ci-certified-burn-live/results.json
            .work/ci-certified-burn-live/logs/**
            .work/ci-certified-burn-live/evidence/*.json
            .work/ci-certified-burn-live/evidence/composed/results.json
            .work/ci-certified-burn-live/evidence/composed/agent.json
            .work/ci-certified-burn-live/evidence/composed/live-observer.png
            .work/ci-certified-burn-live/evidence/direct/results.json
            .work/ci-certified-burn-live/evidence/direct/agent.json
            .work/ci-certified-burn-live/evidence/direct/live-observer.png
          if-no-files-found: warn
          retention-days: 14
