[workspace]
resolver = "2"
members = ["crates/b2z-protocol", "kernels/b2z-mechanics", "tools/conformance-native"]
exclude = ["canisters/runtime-lab", "native"]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.dependencies]
dtr-core = { git = "https://github.com/aodl/dtr.git", rev = "1c7fa8b3bd2c3973a9dc6525b2fe8bb744f21e2e" }
life-conformance = { git = "https://github.com/aodl/dtr.git", rev = "1c7fa8b3bd2c3973a9dc6525b2fe8bb744f21e2e" }

[profile.release]
overflow-checks = true
lto = true
codegen-units = 1
