[workspace]
resolver = "2"
members = ["crates/b2z-protocol", "kernels/b2z-mechanics", "tools/conformance-native"]
exclude = ["canisters/runtime-lab", "native"]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.dependencies]
dtr-core = { git = "https://github.com/aodl/dtr.git", rev = "77ba46cb2f0acd0b4b2eaeedf7dc9fd2dc0f6c68" }
life-conformance = { git = "https://github.com/aodl/dtr.git", rev = "77ba46cb2f0acd0b4b2eaeedf7dc9fd2dc0f6c68" }

[profile.release]
overflow-checks = true
lto = true
codegen-units = 1
