[workspace]
resolver = "2"
members = ["crates/b2z-protocol", "kernels/b2z-mechanics", "tools/conformance-native"]
exclude = ["canisters/runtime-lab", "native"]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.dependencies]
dtr-core = { git = "https://github.com/aodl/dtr.git", rev = "1f47c1a0a104875bd13475d561b8d5aa10770d99" }
life-conformance = { git = "https://github.com/aodl/dtr.git", rev = "1f47c1a0a104875bd13475d561b8d5aa10770d99" }

[profile.release]
overflow-checks = true
lto = true
codegen-units = 1
