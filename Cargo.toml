[workspace]
resolver = "2"
members = ["crates/btz-protocol", "kernels/btz-mechanics", "tools/conformance-native"]
exclude = ["canisters/interface-probe", "canisters/arena-lab", "canisters/runtime-lab", "native"]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.dependencies]
dtr-core = { git = "https://github.com/aodl/dtr.git", rev = "71e59e93cf49a3656689679b538b4c3f138787f8" }
life-conformance = { git = "https://github.com/aodl/dtr.git", rev = "71e59e93cf49a3656689679b538b4c3f138787f8" }

[profile.release]
overflow-checks = true
lto = true
codegen-units = 1
