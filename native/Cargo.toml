[workspace]
resolver = "2"
members = ["dtr-wire", "btz-native", "native-conformance", "dtr-host"]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
num-bigint = "=0.4.6"
num-rational = "=0.4.2"
num-traits = "=0.2.19"
sha2 = "=0.10.9"

[profile.release]
overflow-checks = true
lto = true
codegen-units = 1
