[workspace]
resolver = "2"
members = ["b2z-native", "native-conformance"]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
num-bigint = "=0.4.6"
num-rational = "=0.4.2"
num-traits = "=0.2.19"
sha2 = "=0.10.9"
dtr-host = { git = "https://github.com/aodl/dtr.git", rev = "77ba46cb2f0acd0b4b2eaeedf7dc9fd2dc0f6c68" }
dtr-wire = { git = "https://github.com/aodl/dtr.git", rev = "77ba46cb2f0acd0b4b2eaeedf7dc9fd2dc0f6c68" }

[profile.release]
overflow-checks = true
lto = true
codegen-units = 1
