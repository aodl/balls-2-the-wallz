<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B2Z Reservoir visual fixture</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .review { position: absolute; inset: 10px 10px auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .review img { width: clamp(64px, 16vw, 100px); }
    .presets { display: flex; align-items: center; gap: 6px; }
    .presets select { width: auto; }
    .review-info { position: absolute; bottom: 12px; left: 12px; right: 12px; display: flex; align-items: end; gap: 8px; justify-content: space-between; pointer-events: none; }
    .review-info output { background: #132128; border-radius: 6px; padding: 8px; }
    #fixture-directions { display: flex; gap: 2px; pointer-events: auto; }
  </style>
</head>
<body>
  <canvas id="board" aria-label="Isometric reservoir visual fixture"></canvas>
  <header class="review">
    <img src="wordmark.svg" alt="Balls to the Wallz">
    <div class="presets"><label for="fixture-layout">Fixture</label><select id="fixture-layout"></select></div>
  </header>
  <div class="review-info">
    <output id="fixture-status"></output>
    <nav id="fixture-directions" aria-label="Camera orientation">
      <button value="0" aria-label="North up">N</button><button value="1" aria-label="East up">E</button>
      <button value="2" aria-label="South up">S</button><button value="3" aria-label="West up">W</button>
    </nav>
  </div>
  <script src="fixture.mjs" type="module"></script>
</body>
</html>
