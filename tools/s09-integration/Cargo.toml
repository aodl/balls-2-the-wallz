[workspace]
[package]
name = "dtr-s09-integration"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[[test]]
name = "s14_index"
path = "tests/s14_index.rs"

[dependencies]
b2z-protocol = { path = "../../crates/b2z-protocol" }
candid = "=0.10.37"
pocket-ic = "=16.1.0"
serde_json = "=1.0.145"
serde = { version = "=1.0.228", features = ["derive"] }
dtr-wire = { git = "https://github.com/aodl/dtr.git", rev = "77ba46cb2f0acd0b4b2eaeedf7dc9fd2dc0f6c68" }
dtr-host = { git = "https://github.com/aodl/dtr.git", rev = "77ba46cb2f0acd0b4b2eaeedf7dc9fd2dc0f6c68" }
b2z-native = { path = "../../native/b2z-native" }
ic-ledger-types = "=0.16.0"
ic-agent = { version = "=0.49.2", default-features = false }
leb128 = "=0.2.7"
serde_cbor = "=0.11.2"
tokio = { version = "=1.53.2", features = ["rt-multi-thread"] }
wat = "=1.261.0"
